<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360eDash — Dashboard</title>

<!-- Google Fonts: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Leaflet (peta open-source, dipakai untuk Project Selector) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<!-- Master components (modular, reusable) -->
<link rel="stylesheet" href="master/sidebar/sidebar.css">
<link rel="stylesheet" href="master/header/header.css">

<!-- Page-specific styles -->
<link rel="stylesheet" href="css/project-selector.css">

<style>
  :root {
    --page-bg: #f4f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--page-bg);
    color: #25343F;
  }

  /* ---------- App shell ----------
     Hanya .edash-content yang scroll. Sidebar & header punya tinggi
     tetap (100vh) sehingga header TIDAK PERNAH ikut ter-scroll,
     tidak akan "tenggelam" walau isi halaman panjang. */
  .edash-layout {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .edash-main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .edash-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  #sidebar-root:empty,
  #header-root:empty {
    display: none;
  }

  /* ---------- Global thin scrollbar ----------
     Applies to any scrollable region in the app (content area,
     modals, tables, etc.) so scrollbars look consistent everywhere
     instead of the bulky OS default. */
  * {
    scrollbar-width: thin;
    scrollbar-color: #cfe4e4 transparent;
  }
  *::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  *::-webkit-scrollbar-track {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    background-color: #cfe4e4;
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover {
    background-color: #0f6a71;
  }
</style>
</head>
<body>

<div class="edash-layout">

  <!-- Sidebar mount point -->
  <div id="sidebar-root"></div>

  <div class="edash-main">
    <!-- Header mount point (tidak ikut scroll) -->
    <div id="header-root"></div>

    <main class="edash-content">
      <!-- Halaman aktif dimuat ke sini oleh main.js -->
      <div id="page-root"></div>
    </main>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
<script src="js/project-selector.js" defer></script>
<script src="js/main.js" defer></script>

</body>
</html>
