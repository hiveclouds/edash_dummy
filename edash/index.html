<!-- =========================================================
     Auth Guard — HARUS paling atas & TIDAK pakai "defer".
     Dijalankan sebelum apa pun lain di-load, supaya kalau user
     belum login, dia langsung dilempar ke halaman login tanpa
     sempat melihat isi dashboard (menghindari "flash" konten). -->
<script>
  (function () {
    var isLoggedIn = sessionStorage.getItem("edash-user");
    if (!isLoggedIn) {
      window.location.replace("pages/solar-calculator.html");
    }
  })();
</script>

<style>
  :root {
    --page-bg: #f4f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--page-bg);
    color: #25343F;
  }

  html[data-theme="dark"] body {
    background: #101b1f;
    color: #e7eff0;
  }
  html[data-theme="dark"] .edash-content {
    background: #101b1f;
  }
  html[data-theme="dark"] * {
    scrollbar-color: #315158 transparent;
  }
  html[data-theme="dark"] *::-webkit-scrollbar-thumb {
    background-color: #315158;
  }
  html[data-theme="dark"] *::-webkit-scrollbar-thumb:hover {
    background-color: #21a7ae;
  }

  /* ---------- App shell ----------
     Hanya .edash-content yang scroll. Sidebar & header punya tinggi
     tetap (100vh) sehingga header TIDAK PERNAH ikut ter-scroll,
     tidak akan "tenggelam" walau isi halaman panjang. */
  .edash-layout {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .edash-main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .edash-content {
    position: relative;
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  #sidebar-root:empty,
  #header-root:empty {
    display: none;
  }

  /* ---------- Global thin scrollbar ----------
     Applies to any scrollable region in the app (content area,
     modals, tables, etc.) so scrollbars look consistent everywhere
     instead of the bulky OS default. */
  * {
    scrollbar-width: thin;
    scrollbar-color: #cfe4e4 transparent;
  }
  *::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  *::-webkit-scrollbar-track {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    background-color: #cfe4e4;
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover {
    background-color: #0f6a71;
  }
</style>
</head>
<body>

<div class="edash-layout">

  <!-- Sidebar mount point -->
  <div id="sidebar-root"></div>

  <div class="edash-main">
    <!-- Header mount point (tidak ikut scroll) -->
    <div id="header-root"></div>

    <main class="edash-content">
      <!-- Halaman aktif dimuat ke sini oleh main.js -->
      <div id="page-root"></div>
    </main>
  </div>

</div>

<!-- Logout confirmation modal mount point (overlay, sits outside
     .edash-layout so it's never clipped by any page's overflow) -->
<div id="logout-modal-root"></div>
